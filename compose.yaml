services:
  ragops-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragops_api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - VECTOR_STORE_TYPE=qdrant
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=ragops_documents
      - EMBEDDING_PROVIDER=hash
      - LLM_PROVIDER=mock
      - GATE_MIN_CONTEXT_RECALL=0.90
      - GATE_MIN_CONTEXT_PRECISION=0.70
      - GATE_MIN_FAITHFULNESS=0.85
      - GATE_MIN_ANSWER_RELEVANCY=0.80
      - GATE_MAX_HALLUCINATION_RATE=0.02
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ragops_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_storage:
