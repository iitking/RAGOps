name: RAG Evaluation & Quality Gates CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # Weekly Monday morning scheduled benchmark

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Deterministic Fast CI Checks (Offline Mock & Smoke Benchmark)
  # ----------------------------------------------------------------------------
  unit-and-smoke-tests:
    name: Unit Tests & CI Smoke Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Unit and Integration Tests
        run: |
          pytest tests/ -v --tb=short

      - name: Build Vector Index (Offline Documents)
        run: |
          python -m scripts.build_index --input data/raw

      - name: Run Fast CI Smoke Evaluation (12 Cases)
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: hash
        run: |
          python -m app.evaluation.run_eval --dataset data/eval/test_smoke.jsonl --output reports/eval_smoke.json

      - name: Enforce Smoke Quality Gates
        run: |
          python -m app.evaluation.quality_gates --report reports/eval_smoke.json --min-recall 0.80 --min-relevancy 0.70

      - name: Upload Smoke Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-smoke-report
          path: reports/

  # ----------------------------------------------------------------------------
  # Stage 2: Production Benchmark & Live Gate Enforcement
  # ----------------------------------------------------------------------------
  benchmark-evaluation:
    name: Production Benchmark & Quality Gates
    runs-on: ubuntu-latest
    needs: unit-and-smoke-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Production Benchmark Evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.OPENAI_API_KEY }}
          EMBEDDING_PROVIDER: sentence-transformers
          LLM_PROVIDER: openai
          LLM_MODEL: gpt-4o-mini
        run: |
          if [ -n "$OPENAI_API_KEY" ] || [ -n "$LLM_API_KEY" ]; then
            echo "Executing live LLM benchmark against full 50-case dataset..."
            python -m app.evaluation.run_eval --dataset data/eval/test.jsonl --output reports/eval_live.json
            python -m app.evaluation.quality_gates --report reports/eval_live.json
          else
            echo "API Key secret not provided in environment; validating committed real benchmark report..."
            python -m app.evaluation.quality_gates --report reports/eval_real.json
          fi

      - name: Upload Evaluation Reports & Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: reports/
